<section class="pagina">
  <h1>Contacto</h1>
  <p>Si tenés alguna consulta, escribinos con el siguiente formulario.</p>

  <p *ngIf="enviado" class="exito">¡Gracias! Tu mensaje fue enviado.</p>

  <form (ngSubmit)="enviar()">
    <label for="nombre">Nombre</label>
    <input type="text" id="nombre" name="nombre" [(ngModel)]="nombre" required>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" [(ngModel)]="email" required>

    <label for="mensaje">Mensaje</label>
    <textarea id="mensaje" name="mensaje" rows="5" [(ngModel)]="mensaje" required></textarea>

    <button type="submit">Enviar</button>
  </form>
</section>
